Frontend:
  impl: LoadStoreTrace
  path: l2miss.trace
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3
  DRAM:
    impl: DDR4
    org: { preset: DDR4_8Gb_x8, channel: 1, rank: 2 }
    timing: { preset: DDR4_3200AA }
  AddrMapper:
    impl: RoBaRaCoCh
  Controller:
    impl: Generic
    Scheduler: { impl: FRFCFS }
    RefreshManager: { impl: AllBank }
    RowPolicy: { impl: OpenRowPolicy }
    plugins: [ { ControllerPlugin: { impl: TraceRecorder, path: out/dram_cmd.trace } } ]
